version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: aegis-postgres
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis
      POSTGRES_DB: aegis
    ports:
      - "5432:5432"
    volumes:
      - aegis_pg:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: aegis-redis
    ports:
      - "6379:6379"

volumes:
  aegis_pg:
